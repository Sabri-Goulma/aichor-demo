kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: image
  context: smoke-test
  dockerfile: ./build/ray.Dockerfile

spec:
  operator: kuberay
  image: image
  command: "echo AICHOR-SELECTOR-REPRO-V1 && python3 -u main.py --operator=kuberay --sleep=30"

  debug:
    jupyter: false

  tensorboard:
    enabled: false

  types:
    Head:
      resources:
        cpus: 1
        ramRatio: 2

    Workers:
      - name: cpu-workers
        count: 1
        resources:
          cpus: 1
          ramRatio: 2
          shmSizeGB: 0
